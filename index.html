<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>내 루틴</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="brand">내 루틴</h1>
  <button class="icon-btn" id="btnStorage" aria-label="저장공간">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
</header>

<nav class="tabstrip" id="tabstrip" aria-label="루틴 목록"></nav>

<main id="view" class="view"></main>

<nav class="bottombar" role="tablist">
  <button class="navbtn is-on" data-nav="routine" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4M4 12h4M4 17h4M11 7h9M11 12h9M11 17h9"/></svg>
    <span>루틴</span>
  </button>
  <button class="navbtn" data-nav="log" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>기록</span>
  </button>
  <button class="navbtn" data-nav="lib" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m10 10 5 3-5 3z"/></svg>
    <span>영상함</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="player" id="player" hidden>
  <div class="player-top">
    <span class="player-title" id="playerTitle"></span>
    <button class="icon-btn" id="playerClose" aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <video id="video" controls playsinline preload="metadata"></video>
  <div id="ytbox" hidden></div>
  <div class="player-bottom">
    <button class="btn btn-ghost" id="playerSkip">건너뛰기</button>
    <button class="btn btn-accent" id="playerDone">완료</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="./app.js"></script>
</body>
</html>
